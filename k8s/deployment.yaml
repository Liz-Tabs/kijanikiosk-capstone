apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app.kubernetes.io/name: kk-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kk-payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kk-payments
    spec:
      containers:
        - name: kk-payments
          image: kk-payments:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: kk-payments-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
