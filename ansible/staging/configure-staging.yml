---
- name: Configure KijaniKiosk staging environment
  hosts: staging
  gather_facts: false

  vars:
    staging_namespace: kijani-staging
    repository_root: "{{ playbook_dir }}/../.."
    staging_configmap: "{{ repository_root }}/k8s/configmap-staging.yaml"

  tasks:
    - name: Verify staging namespace exists
      ansible.builtin.command:
        cmd: kubectl get namespace {{ staging_namespace }}
      register: namespace_check
      changed_when: false

    - name: Apply staging configuration
      ansible.builtin.command:
        cmd: kubectl apply -f {{ staging_configmap }}
      register: configmap_apply
      changed_when: "'created' in configmap_apply.stdout or 'configured' in configmap_apply.stdout"

    - name: Verify staging ConfigMap
      ansible.builtin.command:
        cmd: kubectl get configmap kk-payments-config -n {{ staging_namespace }} -o yaml
      register: configmap_check
      changed_when: false

    - name: Display staging configuration result
      ansible.builtin.debug:
        msg:
          - "Namespace: {{ staging_namespace }}"
          - "ConfigMap: kk-payments-config"
          - "Configuration applied successfully."
